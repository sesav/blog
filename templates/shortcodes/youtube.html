{% component youtube(id: string, class: string = "youtube", autoplay: bool = false) %}
<div class="{{ class }}">
    <iframe
        src="https://www.youtube.com/embed/{{ id }}{% if autoplay %}?autoplay=1{% endif %}"
        webkitallowfullscreen
        mozallowfullscreen
        allowfullscreen>
    </iframe>
</div>
{% endcomponent %}
